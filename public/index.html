<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PixelEmpire</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070d;
    color: white;
    font-family: sans-serif;
    height: 100%;
    overflow: hidden;
  }
  #wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  #wrap.dragging { cursor: grabbing; }
  canvas { display: block; }

  #topbar {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    background: rgba(15,15,25,0.9);
    padding: 10px 16px;
    border-radius: 8px;
    max-width: 260px;
  }
  #topbar h1 { font-size: 16px; margin: 0 0 4px 0; }
  #topbar p { font-size: 11px; color: #999; margin: 0; }
  #conn { font-size: 12px; color: #6f6; margin-top: 6px; }

  #counterbox {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    background: rgba(15,15,25,0.9);
    padding: 10px 16px;
    border-radius: 8px;
    width: 180px;
  }
  #counterbox .label { font-size: 12px; color: #ccc; margin-bottom: 6px; display:flex; justify-content:space-between; }
  #counterbar-bg {
    background: #2a2a35;
    border-radius: 5px;
    height: 12px;
    overflow: hidden;
  }
  #counterbar-fill {
    height: 100%;
    width: 0%;
    background: #4caf50;
    transition: width 0.2s linear, background 0.2s linear;
  }
  #counterwarn {
    font-size: 11px;
    color: #f66;
    margin-top: 6px;
    display: none;
  }

  #palette {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 6px;
    background: rgba(15,15,25,0.9);
    padding: 10px;
    border-radius: 10px;
  }
  .color {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .color.selected { border: 2px solid white; }
</style>
</head>
<body>

<div id="topbar">
  <h1>🏰 PixelEmpire</h1>
  <p>Renk seç, haritaya tıkla. Fare tekerleği zoom, sürükle pan.</p>
  <div id="conn">Bağlanıyor...</div>
</div>

<div id="counterbox">
  <div class="label"><span>Sayaç</span><span id="counter-text">0:00 / 2:00</span></div>
  <div id="counterbar-bg"><div id="counterbar-fill"></div></div>
  <div id="counterwarn">⛔ Sayaç dolu, bekle</div>
</div>

<div id="palette"></div>

<div id="wrap">
  <canvas id="canvas"></canvas>
</div>

<script>
  // ================= AYARLAR =================
  const WORLD_W = 360;      // dünya grid genişliği (hücre)
  const WORLD_H = 180;      // dünya grid yüksekliği (hücre)
  const CELL = 2;           // her hücrenin temel (zoom=1) piksel boyutu (küçük pixel)
  const LAND_COLOR = '#ffffff';
  const SEA_COLOR = '#7fd1cc';

  const COLORS = [
    '#e50000', '#0000ea', '#02be01', '#e5d900',
    '#e59500', '#820080', '#00d3dd', '#ffa7d1', '#ffffff', '#222222'
  ];
  let selectedColor = COLORS[0];

  // ================= PALET =================
  const paletteDiv = document.getElementById('palette');
  COLORS.forEach((color) => {
    const sw = document.createElement('div');
    sw.className = 'color';
    sw.style.background = color;
    if (color === selectedColor) sw.classList.add('selected');
    sw.addEventListener('click', () => {
      selectedColor = color;
      document.querySelectorAll('.color').forEach(el => el.classList.remove('selected'));
      sw.classList.add('selected');
    });
    paletteDiv.appendChild(sw);
  });

  // ================= CANVAS / ZOOM / PAN =================
  const wrap = document.getElementById('wrap');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    render();
  }
  window.addEventListener('resize', resizeCanvas);

  let zoom = 2;
  let pan = { x: 0, y: 0 };
  let dragging = false;
  let dragMoved = false;
  let dragStart = { x: 0, y: 0 };

  const worldPixelW = WORLD_W * CELL;
  const worldPixelH = WORLD_H * CELL;

  // Başlangıçta haritayı ortala
  function centerMap() {
    pan.x = (canvas.width - worldPixelW * zoom) / 2;
    pan.y = (canvas.height - worldPixelH * zoom) / 2;
  }

  let pixels = {}; // "x_y" -> color
  let terrainCanvas = null; // önceden çizilmiş kara/deniz katmanı

  function buildTerrainCanvas(terrainStr) {
    const c = document.createElement('canvas');
    c.width = worldPixelW;
    c.height = worldPixelH;
    const tctx = c.getContext('2d');
    tctx.fillStyle = SEA_COLOR;
    tctx.fillRect(0, 0, worldPixelW, worldPixelH);
    tctx.fillStyle = LAND_COLOR;
    for (let gy = 0; gy < WORLD_H; gy++) {
      const rowOffset = gy * WORLD_W;
      let runStart = -1;
      for (let gx = 0; gx <= WORLD_W; gx++) {
        const isLand = gx < WORLD_W && terrainStr[rowOffset + gx] === 'L';
        if (isLand && runStart === -1) {
          runStart = gx;
        } else if (!isLand && runStart !== -1) {
          tctx.fillRect(runStart * CELL, gy * CELL, (gx - runStart) * CELL, CELL);
          runStart = -1;
        }
      }
    }
    terrainCanvas = c;
  }

  function render() {
    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(pan.x, pan.y);
    ctx.scale(zoom, zoom);

    if (terrainCanvas) {
      ctx.drawImage(terrainCanvas, 0, 0);
    } else {
      ctx.fillStyle = SEA_COLOR;
      ctx.fillRect(0, 0, worldPixelW, worldPixelH);
    }

    // boyanmış pixeller
    for (const key in pixels) {
      const [x, y] = key.split('_').map(Number);
      ctx.fillStyle = pixels[key];
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1 / zoom;
    ctx.strokeRect(0, 0, worldPixelW, worldPixelH);

    ctx.restore();
  }

  // --- Zoom (mouse wheel) ---
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const worldX = (mx - pan.x) / zoom;
    const worldY = (my - pan.y) / zoom;

    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoom = Math.min(40, Math.max(0.5, zoom * factor));

    pan.x = mx - worldX * zoom;
    pan.y = my - worldY * zoom;

    render();
  }, { passive: false });

  // --- Pan (mouse drag) ---
  wrap.addEventListener('mousedown', (e) => {
    dragging = true;
    dragMoved = false;
    dragStart = { x: e.clientX - pan.x, y: e.clientY - pan.y };
    wrap.classList.add('dragging');
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const nx = e.clientX - dragStart.x;
    const ny = e.clientY - dragStart.y;
    if (Math.abs(nx - pan.x) > 2 || Math.abs(ny - pan.y) > 2) dragMoved = true;
    pan.x = nx;
    pan.y = ny;
    render();
  });

  window.addEventListener('mouseup', (e) => {
    if (dragging && !dragMoved) {
      handleClick(e);
    }
    dragging = false;
    wrap.classList.remove('dragging');
  });

  function handleClick(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const worldX = (mx - pan.x) / zoom;
    const worldY = (my - pan.y) / zoom;

    const gx = Math.floor(worldX / CELL);
    const gy = Math.floor(worldY / CELL);

    if (gx < 0 || gx >= WORLD_W || gy < 0 || gy >= WORLD_H) return;

    ws.send(JSON.stringify({ type: 'place', x: gx, y: gy, color: selectedColor }));
  }

  // ================= SAYAÇ =================
  const MAX_COUNTER = 120; // 2 dakika
  let counterValue = 0;
  let counterReceivedAt = Date.now();

  const counterText = document.getElementById('counter-text');
  const counterFill = document.getElementById('counterbar-fill');
  const counterWarn = document.getElementById('counterwarn');

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function updateCounterDisplay() {
    const elapsed = (Date.now() - counterReceivedAt) / 1000;
    const current = Math.max(0, counterValue - elapsed);
    const pct = Math.min(100, (current / MAX_COUNTER) * 100);
    counterFill.style.width = pct + '%';
    counterFill.style.background = pct > 85 ? '#e53935' : (pct > 50 ? '#f5a623' : '#4caf50');
    counterText.textContent = fmt(current) + ' / 2:00';
    counterWarn.style.display = current >= MAX_COUNTER ? 'block' : 'none';
  }
  setInterval(updateCounterDisplay, 200);

  // ================= WEBSOCKET =================
  const connDiv = document.getElementById('conn');
  const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(protocol + location.host);

  ws.onopen = () => { connDiv.textContent = '✅ Bağlandı'; };
  ws.onclose = () => { connDiv.textContent = '❌ Bağlantı koptu, sayfayı yenile'; };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'world') {
      pixels = msg.pixels;
      buildTerrainCanvas(msg.terrain);
      counterValue = msg.counter;
      counterReceivedAt = Date.now();
      updateCounterDisplay();
      render();
    } else if (msg.type === 'update') {
      pixels[msg.x + '_' + msg.y] = msg.color;
      render();
    } else if (msg.type === 'counter') {
      counterValue = msg.value;
      counterReceivedAt = Date.now();
      updateCounterDisplay();
    } else if (msg.type === 'blocked') {
      counterValue = msg.value;
      counterReceivedAt = Date.now();
      updateCounterDisplay();
    }
  };

  resizeCanvas();
  centerMap();
  render();
</script>

</body>
</html>
